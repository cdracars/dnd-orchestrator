<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0813">
<title>Dungeon Master's Orchestrator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎲%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-view="chat">
<canvas id="embers"></canvas>

<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#5b21b6"/></linearGradient></defs>
      <polygon points="50,4 93,27 93,73 50,96 7,73 7,27" fill="url(#lg)" stroke="#f5c451" stroke-width="3" stroke-linejoin="round"/>
      <polygon points="50,24 78,68 22,68" fill="rgba(255,255,255,.08)" stroke="#f5c451" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M50 4V24M93 27L50 24M93 27L78 68M93 73L78 68M50 96L78 68M50 96L22 68M7 73L22 68M7 27L22 68M7 27L50 24" stroke="#f5c451" stroke-width="1.4" fill="none" opacity=".7"/>
      <text x="50" y="57" text-anchor="middle" font-family="Cinzel,serif" font-weight="900" font-size="20" fill="#fff">20</text>
    </svg>
    <div>
      <h1>Dungeon Master's <span>Orchestrator</span></h1>
      <p class="tag">Your table's command center</p>
    </div>
  </div>
  <div class="chips">
    <span class="chip" id="modeChip">…</span>
    <span class="chip">🧙 <b id="presence">1</b> at the table</span>
    <button class="chip btn" id="copyUrl" title="Copy the table link">🔗 <span id="urlText">link</span></button>
  </div>
</header>

<main class="app">
  <!-- ARCHIVE -->
  <section class="col panel" id="col-library">
    <div class="ph"><h2>📚 The Archive</h2></div>
    <div class="tabs" id="libTabs"></div>
    <div class="list" id="libList"></div>
  </section>

  <!-- CHAT -->
  <section class="col panel" id="col-chat">
    <div class="ph"><h2>🔮 Speak to the Orchestrator</h2><span class="status" id="thinking"><i></i> consulting the Guild…</span></div>
    <div class="messages" id="messages"></div>
    <div class="quick" id="quick"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Describe what you need… “Prep a spooky crypt encounter for four level-5 heroes and an NPC cultist”" autocomplete="off"></textarea>
      <button type="submit" id="send" title="Send">➤</button>
    </form>
  </section>

  <!-- TABLE -->
  <section class="col" id="col-table">
    <div class="panel guild">
      <div class="ph"><h2>🏰 The Guild</h2></div>
      <div class="agents" id="agents"></div>
    </div>

    <div class="panel dice">
      <div class="ph"><h2>🎲 Dice Tray</h2></div>
      <div class="d20wrap">
        <svg viewBox="0 0 100 100" class="d20" id="bigDie">
          <defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#4c1d95"/></linearGradient></defs>
          <polygon class="shell" points="50,4 93,27 93,73 50,96 7,73 7,27" fill="url(#dg)" stroke="#f5c451" stroke-width="2.5" stroke-linejoin="round"/>
          <polygon points="50,24 78,68 22,68" fill="rgba(255,255,255,.07)" stroke="rgba(245,196,81,.7)" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M50 4V24M93 27L50 24M93 27L78 68M93 73L78 68M50 96L78 68M50 96L22 68M7 73L22 68M7 27L22 68M7 27L50 24" stroke="rgba(245,196,81,.5)" stroke-width="1.2" fill="none"/>
          <text id="dieNum" x="50" y="58" text-anchor="middle" font-family="Cinzel,serif" font-weight="900" font-size="26" fill="#fff">20</text>
        </svg>
        <div class="dieinfo"><div id="dieLabel">Tap a die to roll</div><small id="dieSub">shared with everyone at the table</small></div>
      </div>
      <div class="dicebtns" id="diceBtns"></div>
      <div class="dicerow">
        <label>×<input type="number" id="dCount" value="1" min="1" max="20"></label>
        <label>±<input type="number" id="dMod" value="0" min="-20" max="30"></label>
        <div class="seg" id="advSeg"><button data-v="none" class="on">Normal</button><button data-v="advantage">Adv</button><button data-v="disadvantage">Dis</button></div>
      </div>
      <div class="dicerow"><input id="who" placeholder="Your name at the table" maxlength="20"></div>
      <div class="rolllog" id="rollLog"></div>
    </div>

    <div class="panel war">
      <div class="ph"><h2>🛡️ War Table</h2><span class="rnd" id="roundTag"></span></div>
      <div id="combat"></div>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="library">📚<span>Archive</span></button>
  <button data-view="chat" class="on">🔮<span>Orchestrate</span></button>
  <button data-view="table">🎲<span>Table</span></button>
</nav>

<dialog id="modal"><button class="x" id="modalx" aria-label="Close">✕</button><div id="modalbody"></div></dialog>
<div id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
